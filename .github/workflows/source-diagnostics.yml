name: Public Deal Source Diagnostics

on:
  workflow_dispatch:
    inputs:
      source_filter:
        description: "Optional comma-separated source name/store/domain filter"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-diagnostics.yml"
      - "scripts/diagnose_sources.py"
      - "config/sources.json"
      - "deal_hunter/sources.py"
      - "deal_hunter/models.py"

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect public deal pages without posting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIAGNOSTIC_SOURCE_FILTER: ${{ inputs.source_filter || (github.event_name == 'push' && 'Пятёрочка,Ozon,Wildberries,Самокат,Купер,Магнит,Дикси,Чижик,Лента,Перекрёсток,METRO,Глобус,Fix Price,Ашан,О’КЕЙ') || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect published HTML
        run: python scripts/diagnose_sources.py
