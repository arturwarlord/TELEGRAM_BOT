name: Deal Hunter

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать подходящие предложения с прямыми ссылками, без партнёрки"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deal-hunter-main
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  scan:
    name: Scan deals
    needs: tests
    runs-on: ubuntu-latest
    env:
      # Scheduled runs publish direct links; one explicitly named push can seed the first batch.
      # Any ordinary push stays dry-run. Pause scheduled publishing with Actions Variable DRY_RUN=true.
      PUBLISH_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish == true) || github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'launch one-time direct posts:')) }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish != true) || (github.event_name == 'schedule' && vars.DRY_RUN == 'true') || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'launch one-time direct posts:')) }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      AD_NOTICE: ${{ vars.AD_NOTICE }}
      SOURCE_CONFIG_PATH: config/sources.json
      TAKPRODAM_API_TOKEN: ${{ secrets.TAKPRODAM_API_TOKEN }}
      AVIASALES_API_TOKEN: ${{ secrets.AVIASALES_API_TOKEN }}
      TAKPRODAM_SOURCE_ID: ${{ vars.TAKPRODAM_SOURCE_ID }}
      TAKPRODAM_MARKETPLACES: ${{ vars.TAKPRODAM_MARKETPLACES }}
      TAKPRODAM_LIMIT: ${{ vars.TAKPRODAM_LIMIT }}
      TAKPRODAM_MAX_PAGES: ${{ vars.TAKPRODAM_MAX_PAGES }}
      TAKPRODAM_SUBID: ${{ vars.TAKPRODAM_SUBID }}
      # Keep direct-link mode on while building traffic before partner approval.
      ALLOW_DIRECT_LINKS: "true"
      POST_NOTICE: ${{ vars.POST_NOTICE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan configured feeds
        run: python main.py
      - name: Persist publication state, including partial publish successes
        if: always() && env.PUBLISH_ENABLED == 'true' && env.DRY_RUN == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist deal publication state"
            git push
          else
            echo "No state changes to save."
          fi
