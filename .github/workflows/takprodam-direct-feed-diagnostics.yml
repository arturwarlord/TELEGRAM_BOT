name: Takprodam Direct Marketplace Feed Diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/takprodam-direct-feed-diagnostics.yml"
      - "scripts/diagnose_takprodam_direct_feed.py"
      - "deal_hunter/takprodam.py"
      - "tests/test_takprodam.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect direct marketplace links without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAKPRODAM_API_TOKEN: ${{ secrets.TAKPRODAM_API_TOKEN }}
      TAKPRODAM_SOURCE_ID: ${{ vars.TAKPRODAM_SOURCE_ID || secrets.TAKPRODAM_SOURCE_ID }}
      TAKPRODAM_MARKETPLACES: "Ozon,Wildberries,Yandex Market"
      TAKPRODAM_LIMIT: "100"
      TAKPRODAM_MAX_PAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read direct-link product data
        run: python scripts/diagnose_takprodam_direct_feed.py
