name: Telegram Setup Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-check.yml"
      - "scripts/check_telegram.py"
      - "deal_hunter/telegram_check.py"

permissions:
  contents: read

jobs:
  check:
    name: Verify Telegram token and channel permissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Telegram configuration without publishing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: python scripts/check_telegram.py
